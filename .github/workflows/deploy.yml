# Spielt die Webseite (Ordner site/ inkl. PHP-API) bei jeder Code-Aenderung hoch.
# config.php (Datenbank, Token) wird aus GitHub-Secrets erzeugt und landet nie im Repo.
# Die .htaccess mit dem Passwortschutz schreibt der Server selbst (passwort-setzen.ps1);
# per FTP hochgeladen fuehrte sie bei World4You zu HTTP 500. Der Deploy fasst sie nicht an.
name: Webseite veroeffentlichen

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: preise-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Erst aktiv, wenn die Repo-Variable AKTIV=ja gesetzt ist (nach Einrichtung von Webspace und Secrets)
    if: ${{ vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: config.php aus Secrets erzeugen
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          PT_TOKEN: ${{ secrets.PT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          def php(s): return "'" + s.replace("\\", "\\\\").replace("'", "\\'") + "'"
          werte = {k: os.environ.get(v, '').strip() for k, v in [('db_host','DB_HOST'),('db_name','DB_NAME'),('db_user','DB_USER'),('db_pass','DB_PASS'),('api_token','PT_TOKEN')]}
          zeilen = ["<?php", "return ["] + [f"    {php(k)} => {php(v)}," for k, v in werte.items()] + ["];", ""]
          open('site/api/config.php', 'w', encoding='utf-8').write("\n".join(zeilen))
          PY

      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}
          # daten/ kommt vom taeglichen Abruf, rechnungen/ nur ueber den Upload
          exclude: |
            **/.git*
            **/.git*/**
            daten/**
            daten.js
            rechnungen/**
            eigene/**
            api/config.beispiel.php
