# Holt einmal taeglich das Gesamtsortiment aller Maerkte - so parallel wie moeglich:
#   planen          liest konfig.json ("abruf") und erzeugt die Job-Liste (neue Shops nur dort eintragen)
#   markt           je Markt ein eigener Job (Billa, Penny, Hofer, Lidl, Tchibo, ...), jeder schreibt Rohdaten
#   teil            grosse Maerkte (derzeit Spar) in viele Teile; jeder Teil auf eigenem Runner mit eigener IP,
#                   die Spar-Drosselung (Cloudflare) bremst die Teile also nicht gegenseitig
#   vorab           sobald alle schnellen Maerkte fertig sind: Seite sofort aktualisieren (aufgeteilte Maerkte
#                   bleiben bis zum Ende auf dem Vortag), ohne Historie zu speichern
#   zusammenfuehren alles zusammenfuehren, Historie fortschreiben, Seite hochladen, Historie speichern.
#                   Laeuft auch, wenn einzelne Jobs ausfallen (diese Maerkte/Teile fehlen dann fuer einen Tag).
# Oeffentliches Repo -> Actions-Minuten sind kostenlos.
name: Preise abrufen

on:
  schedule:
    - cron: '23 4 * * *'     # taeglich 04:23 UTC (05:23/06:23 in Wien)
  workflow_dispatch:

permissions:
  contents: write            # Historie und Spar-Kategorien im Repo speichern

concurrency:
  group: preise-abruf
  cancel-in-progress: false

jobs:
  planen:
    # Erst aktiv, wenn die Repo-Variable AKTIV=ja gesetzt ist (nach Einrichtung von Webspace und Secrets)
    if: ${{ vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      schnell: ${{ steps.plan.outputs.schnell }}
      langsam: ${{ steps.plan.outputs.langsam }}
      schnelleliste: ${{ steps.plan.outputs.schnelleliste }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        shell: pwsh
        run: ./abruf-plan.ps1 | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

  markt:
    needs: planen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        markt: ${{ fromJSON(needs.planen.outputs.schnell) }}
    steps:
      - uses: actions/checkout@v5
      - name: ${{ matrix.markt }} abrufen
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte ${{ matrix.markt }} -RohSchreiben roh
      - uses: actions/upload-artifact@v4
        with:
          name: roh-${{ matrix.markt }}
          path: roh/
          retention-days: 1

  teil:
    needs: planen
    if: ${{ needs.planen.outputs.langsam != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        auftrag: ${{ fromJSON(needs.planen.outputs.langsam) }}
    steps:
      - uses: actions/checkout@v5
      - name: ${{ matrix.auftrag.markt }} Teil ${{ matrix.auftrag.teil }} von ${{ matrix.auftrag.teile }}
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte ${{ matrix.auftrag.markt }} -Teil ${{ matrix.auftrag.teil }} -Teile ${{ matrix.auftrag.teile }} -RohSchreiben roh
      - uses: actions/upload-artifact@v4
        with:
          name: roh-${{ matrix.auftrag.markt }}-${{ matrix.auftrag.teil }}
          path: roh/
          retention-days: 1

  # Sobald die schnellen Maerkte fertig sind: Seite vorab aktualisieren. Speichert die Historie NICHT -
  # das macht nur "zusammenfuehren", damit es keine Konflikte gibt.
  vorab:
    needs: [planen, markt]
    if: ${{ always() && vars.AKTIV == 'ja' && needs.planen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: roh-*
          path: roh
          merge-multiple: true
      - name: Kategorie-Korrekturen vom Webspace holen
        # Von der Seite gespeichert (api/zuordnung.php -> eigene/zuordnung.json). Klappt das nicht,
        # gilt der Stand aus dem Repo (daten/zuordnung.json) - die Korrekturen gehen also nie verloren.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOKOLL: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          FTP_ZIELORDNER: ${{ vars.FTP_ZIELORDNER || './' }}
        run: |
          ssl=""; [ "$FTP_PROTOKOLL" != "ftp" ] && ssl="--ssl-reqd"
          pfad="${FTP_ZIELORDNER#./}"
          if curl -sS -k $ssl --max-time 60 -u "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_SERVER/${pfad}eigene/zuordnung.json" -o /tmp/zuordnung.json              && python3 -c "import json,sys; json.load(open('/tmp/zuordnung.json'))"; then
            mv /tmp/zuordnung.json daten/zuordnung.json && echo "Korrekturen vom Webspace geholt"
          else
            echo "Keine Korrekturen vom Webspace - Stand aus dem Repo wird verwendet"
          fi

      - name: Seite mit den schnellen Maerkten aktualisieren
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte ${{ needs.planen.outputs.schnelleliste }} -RohLesen roh
      - name: Daten per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          local-dir: ./site/daten/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}daten/
          state-name: .ftp-deploy-daten.json
          log-level: minimal

  zusammenfuehren:
    needs: [planen, markt, teil, vorab]
    if: ${{ always() && vars.AKTIV == 'ja' && needs.planen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # neuester Stand des Branches (nicht der beim Start des Laufs): ein anderer Lauf oder der Spar-Abruf
      # vom PC kann die Historie inzwischen gespeichert haben
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Rohdaten aller Jobs holen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: roh-*
          path: roh
          merge-multiple: true

      - name: Kategorie-Korrekturen vom Webspace holen
        # Von der Seite gespeichert (api/zuordnung.php -> eigene/zuordnung.json). Klappt das nicht,
        # gilt der Stand aus dem Repo (daten/zuordnung.json) - die Korrekturen gehen also nie verloren.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOKOLL: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          FTP_ZIELORDNER: ${{ vars.FTP_ZIELORDNER || './' }}
        run: |
          ssl=""; [ "$FTP_PROTOKOLL" != "ftp" ] && ssl="--ssl-reqd"
          pfad="${FTP_ZIELORDNER#./}"
          if curl -sS -k $ssl --max-time 60 -u "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_SERVER/${pfad}eigene/zuordnung.json" -o /tmp/zuordnung.json              && python3 -c "import json,sys; json.load(open('/tmp/zuordnung.json'))"; then
            mv /tmp/zuordnung.json daten/zuordnung.json && echo "Korrekturen vom Webspace geholt"
          else
            echo "Keine Korrekturen vom Webspace - Stand aus dem Repo wird verwendet"
          fi

      - name: Zuordnen, Historie fortschreiben, Seiten-Dateien erzeugen
        shell: pwsh
        run: ./abrufen.ps1 -RohLesen roh

      - name: Daten per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          local-dir: ./site/daten/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}daten/
          state-name: .ftp-deploy-daten.json
          log-level: minimal

      - name: Historie speichern
        # Hat inzwischen jemand anderes gespeichert (Konflikt in historie.json), wird auf dessen Stand
        # neu zusammengefuehrt und nochmals versucht - statt abzubrechen.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dateien="daten/historie.json daten/spar-kategorien.json daten/zuordnung.json"
          for versuch in 1 2 3; do
            git add $dateien
            if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
            git commit -q -m "Preis-Historie aktualisiert"
            if git pull --rebase -q && git push -q; then echo "Gespeichert (Versuch $versuch)"; exit 0; fi
            echo "Konflikt beim Speichern - fuehre auf dem neuesten Stand neu zusammen (Versuch $versuch)"
            git rebase --abort 2>/dev/null || true
            cp daten/zuordnung.json /tmp/zuordnung.json
            # nur den eigenen, noch nicht gepushten Commit zuruecknehmen und den neuesten Stand holen
            git reset -q HEAD~1
            git checkout -- $dateien
            git pull -q --ff-only
            cp /tmp/zuordnung.json daten/zuordnung.json
            pwsh -NoProfile -Command "./abrufen.ps1 -RohLesen roh"
          done
          echo "Historie konnte nicht gespeichert werden"; exit 1
