# Holt einmal taeglich das Gesamtsortiment aller Maerkte - parallel aufgeteilt:
#   andere          Billa, Penny, Hofer, Lidl, Tchibo (ca. 10 Minuten)
#   spar (8 Teile)  je ein Achtel der Spar-Kategorien; jeder Teil laeuft auf eigenem Runner mit
#                   eigener IP, die Spar-Drosselung (Cloudflare) bremst die Teile also nicht gegenseitig
#   vorab           sobald "andere" fertig ist: Seite schon aktualisieren (Spar vom Vortag), ohne Historie zu speichern
#   zusammenfuehren Rohdaten zusammenfuehren, Historie fortschreiben, Seite hochladen, Historie speichern.
#                   Laeuft auch, wenn einzelne Teile ausfallen (diese Maerkte/Teile fehlen dann fuer einen Tag).
# Oeffentliches Repo -> Actions-Minuten sind kostenlos.
name: Preise abrufen

on:
  schedule:
    - cron: '23 4 * * *'     # taeglich 04:23 UTC (05:23/06:23 in Wien)
  workflow_dispatch:

permissions:
  contents: write            # Historie und Spar-Kategorien im Repo speichern

concurrency:
  group: preise-abruf
  cancel-in-progress: false

jobs:
  andere:
    # Erst aktiv, wenn die Repo-Variable AKTIV=ja gesetzt ist (nach Einrichtung von Webspace und Secrets)
    if: ${{ vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Billa, Penny, Hofer, Lidl, Tchibo abrufen
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte billa,penny,hofer,lidl,tchibo -RohSchreiben roh
      - uses: actions/upload-artifact@v4
        with:
          name: roh-andere
          path: roh/
          retention-days: 1

  spar:
    if: ${{ vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - name: Spar Teil ${{ matrix.teil }} von 8 abrufen
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte spar -SparTeil ${{ matrix.teil }} -SparTeile 8 -RohSchreiben roh
      - uses: actions/upload-artifact@v4
        with:
          name: roh-spar-${{ matrix.teil }}
          path: roh/
          retention-days: 1

  # Sobald die schnellen Maerkte fertig sind: Seite vorab aktualisieren (Spar bleibt auf dem Vortag).
  # Speichert die Historie NICHT - das macht nur "zusammenfuehren", damit es keine Konflikte gibt.
  vorab:
    needs: [andere]
    if: ${{ vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: roh-andere
          path: roh
      - name: Seite mit Billa, Penny, Hofer, Lidl, Tchibo aktualisieren
        shell: pwsh
        run: ./abrufen.ps1 -Maerkte billa,penny,hofer,lidl,tchibo -RohLesen roh
      - name: Daten per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          local-dir: ./site/daten/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}daten/
          state-name: .ftp-deploy-daten.json
          log-level: minimal

  zusammenfuehren:
    needs: [andere, spar, vorab]
    if: ${{ always() && vars.AKTIV == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Rohdaten aller Teile holen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: roh-*
          path: roh
          merge-multiple: true

      - name: Zuordnen, Historie fortschreiben, Seiten-Dateien erzeugen
        shell: pwsh
        run: ./abrufen.ps1 -RohLesen roh -SparTeile 8

      - name: Daten per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          local-dir: ./site/daten/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}daten/
          state-name: .ftp-deploy-daten.json
          log-level: minimal

      - name: Historie speichern
        run: |
          git add daten/historie.json daten/spar-kategorien.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Preis-Historie aktualisiert"
            git pull --rebase -q
            git push -q
          fi
