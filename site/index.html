<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preis-Tracker</title>
<meta name="description" content="Lebensmittelpreise in Österreich: Aktionen gegen den echten Preisverlauf geprüft.">
<style>
:root {
  --bg: #f6f7f9; --fl: #ffffff; --text: #1b1f24; --leise: #5f6b7a; --linie: #dde2e8;
  --akzent: #1f6feb; --gut: #1a7f37; --gut-bg: #dafbe1; --mittel: #9a6700; --mittel-bg: #fff3c4;
  --schlecht: #c62828; --schlecht-bg: #ffe2e0; --neutral-bg: #eceff3;
  --billa: #e2001a; --penny: #cd1719; --spar: #00843d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --fl: #181c22; --text: #e6e9ee; --leise: #9aa5b3; --linie: #2a3039;
    --akzent: #4c8dff; --gut: #4ac26b; --gut-bg: #12301c; --mittel: #d9a33a; --mittel-bg: #33280f;
    --schlecht: #ff6b62; --schlecht-bg: #3a1614; --neutral-bg: #232932;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --fl: #181c22; --text: #e6e9ee; --leise: #9aa5b3; --linie: #2a3039;
  --akzent: #4c8dff; --gut: #4ac26b; --gut-bg: #12301c; --mittel: #d9a33a; --mittel-bg: #33280f;
  --schlecht: #ff6b62; --schlecht-bg: #3a1614; --neutral-bg: #232932;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--akzent); }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--linie); }
.kopf { max-width: 1280px; margin: 0 auto; padding: 10px 16px 0; }
.titel { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 19px; margin: 0; }
.stand { color: var(--leise); font-size: 13px; }
.reiter { display: flex; gap: 4px; margin-top: 8px; }
.reiter button { border: 0; background: none; padding: 8px 12px; border-bottom: 3px solid transparent; cursor: pointer; color: var(--leise); font-weight: 600; }
.reiter button[aria-selected="true"] { color: var(--text); border-color: var(--akzent); }
.filter { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0 10px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.stern { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; padding: 0 4px 0 0; color: var(--leise); vertical-align: -2px; }
.stern[aria-pressed="true"] { color: #e3a008; }
.chip-fav[aria-pressed="true"] { background: #e3a008; border-color: #e3a008; color: #fff; }
.chip { border: 1px solid var(--linie); background: var(--fl); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.filter select, .filter input { border: 1px solid var(--linie); background: var(--fl); border-radius: 8px; padding: 6px 8px; font-size: 14px; min-width: 0; }
.filter input[type=search] { flex: 1 1 160px; }
@media (max-width: 640px) {
  header { position: static; }
  .filter select { flex: 1 1 40%; }
}
.unter { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 10px; }
.unter .chip { font-size: 13px; padding: 4px 10px; }
.unter .chip small { color: inherit; opacity: .7; margin-left: 3px; }
.unter .chip[disabled] { opacity: .45; cursor: default; }
@media (max-width: 640px) {
  .unter { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 10px; scrollbar-width: none; }
  .unter .chip { flex: 0 0 auto; }
}
.anzahl { color: var(--leise); font-size: 13px; }
.knopf-leise { border: 0; background: none; color: var(--akzent); cursor: pointer; padding: 4px; font-size: 13px; }

main { min-width: 0; padding: 8px 0 40px; }
/* Seitenaufbau: Kategorie-Menue links, Inhalt rechts */
.rahmen { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
.pfad { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13px; color: var(--leise); margin: 4px 0 2px; }
.pfad button { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--akzent); font-size: 13px; }
.pfad b { color: var(--text); font-weight: 600; }
.pfad .trenner { opacity: .6; }
.katnav { position: sticky; top: calc(var(--kopf-h, 0px) + 10px); margin-top: 10px; max-height: calc(100vh - var(--kopf-h, 0px) - 20px); overflow: auto; overscroll-behavior: contain;
  background: var(--fl); border: 1px solid var(--linie); border-radius: 12px; padding: 6px; scrollbar-width: thin; }
.nav-kopf { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; font-weight: 700; font-size: 15px; }
.nav-kopf small { font-weight: 500; color: var(--leise); font-size: 12px; }
.nav-zu { display: none; border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--leise); padding: 0 4px; }
.nav-baum, .nav-unter { list-style: none; margin: 0; padding: 0; }
.nav-zeile { display: flex; align-items: stretch; border-radius: 8px; }
.nav-eintrag { flex: 1; min-width: 0; width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; cursor: pointer; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--text); }
.nav-eintrag span.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-eintrag .zahl { color: var(--leise); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-eintrag:hover, .nav-auf:hover { background: var(--neutral-bg); }
.nav-eintrag[aria-current="page"] { background: color-mix(in srgb, var(--akzent) 14%, transparent); color: var(--akzent); font-weight: 600; }
.nav-eintrag[aria-current="page"] .zahl { color: var(--akzent); }
.nav-eintrag.leer { opacity: .45; }
.nav-auf { flex: 0 0 34px; border: 0; background: none; cursor: pointer; border-radius: 8px; color: var(--leise); display: flex; align-items: center; justify-content: center; }
.nav-auf svg { width: 14px; height: 14px; transition: transform .18s ease; }
.nav-auf[aria-expanded="true"] svg { transform: rotate(90deg); }
.nav-unter { margin: 2px 0 6px 14px; padding-left: 8px; border-left: 2px solid var(--linie); display: none; }
.nav-kat.offen > .nav-unter { display: block; }
.nav-unter .nav-eintrag { padding: 6px 10px; font-size: 13.5px; }
.nav-alle .nav-eintrag { font-weight: 600; }
.nav-trenn { height: 1px; background: var(--linie); margin: 4px 8px; }
.nav-fuss { display: none; }
/* Hersteller-Filter im Menue */
.nav-marken { border-top: 1px solid var(--linie); margin-top: 8px; padding-top: 4px; }
.nav-marken .nav-kopf .knopf-leise { font-weight: 500; }
.nav-marken input[type=search] { width: calc(100% - 12px); margin: 0 6px 6px; border: 1px solid var(--linie); background: var(--bg); border-radius: 8px; padding: 7px 9px; font-size: 14px; }
.marken-liste { list-style: none; margin: 0; padding: 0; }
.marke { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.marke:hover { background: var(--neutral-bg); }
.marke input { margin: 0; width: 16px; height: 16px; accent-color: var(--akzent); flex: 0 0 auto; }
.marke .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marke .zahl { color: var(--leise); font-size: 12px; font-variant-numeric: tabular-nums; }
.marke.leer { opacity: .5; }
.meta .hs { font-weight: 600; color: var(--text); }
.marke-nichts { color: var(--leise); font-size: 13px; padding: 6px 10px; }
#marken-mehr { margin: 2px 4px 6px; }
.marke-chip { display: inline-flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--akzent) 14%, transparent); color: var(--akzent); border-radius: 999px; padding: 1px 4px 1px 10px; font-weight: 600; margin-left: 6px; }
.marke-chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.kat-knopf { display: none; }
.nav-schleier { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 14; opacity: 0; pointer-events: none; transition: opacity .2s; }
@media (min-width: 1000px) { .unter { display: none !important; } }
@media (max-width: 999px) {
  .rahmen { grid-template-columns: minmax(0, 1fr); }
  .kat-knopf { display: inline-flex; align-items: center; gap: 6px; }
  .kat-knopf[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: #fff; }
  .katnav { position: fixed; z-index: 15; top: 0; left: 0; bottom: 0; margin: 0; width: min(340px, 88vw); max-height: none; border-radius: 0 14px 14px 0; border-left: 0;
    padding: 6px 6px 0; transform: translateX(-105%); transition: transform .22s ease; box-shadow: 6px 0 24px rgba(0,0,0,.2); display: flex; flex-direction: column; overflow: hidden; }
  .katnav .nav-inhalt { flex: 1; overflow: auto; overscroll-behavior: contain; }
  .nav-offen .katnav { transform: none; }
  .nav-offen .nav-schleier { opacity: 1; pointer-events: auto; }
  .nav-zu { display: block; }
  .nav-eintrag { padding: 11px 10px; font-size: 15px; }
  .nav-unter .nav-eintrag { padding: 9px 10px; font-size: 14.5px; }
  .nav-fuss { display: block; padding: 10px 4px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linie); }
  .nav-fuss button { width: 100%; border: 0; border-radius: 10px; background: var(--akzent); color: #fff; font-weight: 600; padding: 12px; cursor: pointer; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .katnav, .nav-schleier, .nav-auf svg { transition: none; } }
.hinweis { background: var(--fl); border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px; color: var(--leise); font-size: 14px; margin: 8px 0; }
.liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.zeile { background: var(--fl); border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 60px 1fr auto; gap: 4px 12px; cursor: pointer; align-items: start; }
.bild { width: 60px; height: 60px; border-radius: 8px; background: #fff; border: 1px solid var(--linie); object-fit: contain; display: block; grid-row: span 2; }
.bild-leer { display: flex; align-items: center; justify-content: center; color: var(--leise); font-size: 22px; background: var(--bg); }
.bild-gross { width: 140px; height: 140px; border-radius: 10px; background: #fff; border: 1px solid var(--linie); object-fit: contain; float: right; margin: 26px 0 8px 12px; }
@media (max-width: 400px) { .zeile { grid-template-columns: 48px 1fr auto; gap: 4px 10px; } .bild { width: 48px; height: 48px; } .bild-gross { width: 100px; height: 100px; } }
.zeile:hover { border-color: var(--akzent); }

/* Darstellung umschalten */
.ansicht { display: inline-flex; border: 1px solid var(--linie); border-radius: 8px; overflow: hidden; margin-left: auto; }
.ansicht button { border: 0; background: var(--fl); padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--leise); }
.ansicht button[aria-pressed="true"] { background: var(--akzent); color: #fff; }

/* Kachel-Ansicht: Bild im Vordergrund */
.liste.kacheln { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kachel { display: flex; flex-direction: column; gap: 3px; padding: 8px 8px 10px; }
.kachel-bild { position: relative; aspect-ratio: 1 / 1; background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
.kachel-bild .kbild { width: 100%; height: 100%; object-fit: contain; display: block; }
.kachel-bild .bild-leer { width: 100%; height: 100%; font-size: 40px; }
.kachel-bild .stern { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); border-radius: 50%; width: 32px; height: 32px; padding: 0; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.kachel-preis b { font-size: 17px; }
.kachel-preis s { color: var(--leise); font-size: 13px; margin-left: 4px; }
.kachel-je { color: var(--leise); font-size: 12px; margin-top: -2px; }
.kachel-name { font-weight: 600; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kachel .meta { color: var(--leise); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kachel .marken { margin-top: 2px; }
.kachel .badge { font-size: 11px; }
@media (max-width: 640px) { .liste.kacheln { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
.zeile .name { font-weight: 600; overflow-wrap: anywhere; }
.zeile .meta { color: var(--leise); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.preis { text-align: right; white-space: nowrap; }
.preis b { font-size: 17px; }
.preis s { color: var(--leise); font-size: 13px; margin-left: 4px; }
.preis .je { display: block; color: var(--leise); font-size: 12px; }
.markt { font-size: 11px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; text-transform: uppercase; letter-spacing: .3px; }
.m-billa { background: var(--billa); } .m-penny { background: var(--penny); } .m-spar { background: var(--spar); } .m-lidl { background: #0050aa; } .m-hofer { background: #00205b; } .m-tchibo { background: #6b4226; }
/* Fallback fuer kuenftige Maerkte ohne eigene Farbe */
.markt:not(.m-billa):not(.m-penny):not(.m-spar):not(.m-lidl):not(.m-hofer):not(.m-tchibo) { background: var(--leise); }
.marken { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
.b-echt { background: var(--gut-bg); color: var(--gut); }
.b-maessig { background: var(--mittel-bg); color: var(--mittel); }
.b-lockvogel { background: var(--schlecht-bg); color: var(--schlecht); }
.b-neu { background: var(--neutral-bg); color: var(--leise); }
.b-flag { background: var(--schlecht-bg); color: var(--schlecht); font-weight: 500; }
[hidden] { display: none !important; }
/* Aktionszeitraum */
.zeit { font-size: 12px; margin-top: 3px; color: var(--leise); }
.zeit.z-ok { color: var(--gut); }
.zeit.z-knapp { color: var(--schlecht); font-weight: 600; }
.zeit.z-bald { color: var(--akzent); }
p.zeit { font-size: 13px; margin: 6px 0 0; }
/* Kategorie-Uebersicht */
.liste.katliste { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.katkachel { display: block; }
.kat-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.katkachel .meta { color: var(--leise); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
.kat-unter { color: var(--leise); font-size: 12px; margin-top: 6px; line-height: 1.4; }
.gruppe { grid-column: 1 / -1; list-style: none; font-weight: 600; font-size: 14px; color: var(--leise); padding: 6px 2px 0; }
.fav-info b { color: var(--text); }
.mehr { display: block; margin: 12px auto; border: 1px solid var(--linie); background: var(--fl); border-radius: 8px; padding: 8px 16px; cursor: pointer; }

/* Detail: unten als Blatt am Handy, rechts am Desktop */
.schleier { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
.blatt { position: fixed; z-index: 21; background: var(--fl); display: none; overflow: auto; left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 14px 14px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,.2); }
.offen .schleier, .offen .blatt { display: block; }
@media (min-width: 820px) {
  .blatt { left: auto; top: 0; width: 460px; max-height: none; border-radius: 0; box-shadow: -4px 0 24px rgba(0,0,0,.2); }
}
.blatt h2 { font-size: 17px; margin: 0 30px 4px 0; }
.zu { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--leise); }
.kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.kz { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.kz span { display: block; color: var(--leise); font-size: 12px; }
.kz b { font-size: 16px; }
.befund { margin: 10px 0; padding: 0 0 0 18px; }
.befund li { margin: 4px 0; }
svg.verlauf { width: 100%; height: auto; display: block; }
svg.verlauf text { fill: var(--leise); font-size: 11px; }
.legende { display: flex; gap: 14px; font-size: 12px; color: var(--leise); flex-wrap: wrap; }
.legende i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
table.punkte { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
table.punkte td, table.punkte th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--linie); }
table.punkte th { color: var(--leise); font-weight: 500; }
.aktionen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.aktionen a, .aktionen button { border: 1px solid var(--linie); background: var(--bg); border-radius: 8px; padding: 7px 12px; text-decoration: none; color: var(--text); cursor: pointer; font-size: 14px; }
.tipps { background: var(--fl); border: 1px solid var(--linie); border-radius: 10px; padding: 8px 12px; margin: 0 0 8px; }
.tipps summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.tipps ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.tipps li { margin: 4px 0; }
.tipps small { color: var(--leise); }
code { background: var(--bg); padding: 1px 4px; border-radius: 4px; font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <div class="kopf">
    <div class="titel"><h1>Preis-Tracker</h1><span class="stand" id="stand"></span></div>
    <div class="reiter" role="tablist">
      <button role="tab" id="r-angebote" aria-selected="true">Angebote</button>
      <button role="tab" id="r-alle" aria-selected="false">Alle Artikel</button>
    </div>
    <div class="filter">
      <div class="chips" id="maerkte"></div>
      <button class="chip chip-fav" id="nur-fav" aria-pressed="false">★ Favoriten</button>
      <button class="chip kat-knopf" id="kat-knopf" aria-controls="katnav" aria-expanded="false" aria-pressed="false">☰ <span id="kat-knopf-text">Kategorien</span></button>
      <select id="bewertung" aria-label="Bewertung">
        <option value="">Alle Bewertungen</option>
        <option value="echt">Echtes Angebot</option>
        <option value="maessig">Mäßig</option>
        <option value="lockvogel">Lockvogel</option>
        <option value="neu">Noch zu wenig Verlauf</option>
        <option value="flag">Mit Warnhinweis</option>
        <option value="demnaechst">Demnächst (kommende Angebote)</option>
      </select>
      <select id="sortierung" aria-label="Sortierung"></select>
      <input type="search" id="suche" placeholder="Suchen …" aria-label="Suchen">
      <span class="anzahl" id="anzahl"></span>
      <button class="knopf-leise" id="zuruecksetzen" hidden>Filter zurücksetzen</button>
      <div class="ansicht" role="group" aria-label="Darstellung">
        <button data-ansicht="liste" aria-pressed="true" title="Liste">☰ Liste</button>
        <button data-ansicht="kacheln" aria-pressed="false" title="Kacheln mit großen Bildern">▦ Kacheln</button>
      </div>
    </div>
    <div class="unter" id="unter" hidden></div>
  </div>
</header>
<div class="rahmen">
<nav class="katnav" id="katnav" aria-label="Kategorien">
  <div class="nav-kopf"><span>Kategorien <small id="nav-info"></small></span><button class="nav-zu" id="nav-zu" aria-label="Menü schließen">×</button></div>
  <div class="nav-inhalt" id="nav-inhalt">
    <div id="nav-kats"></div>
    <section class="nav-marken" id="nav-marken" hidden>
      <div class="nav-kopf"><span>Hersteller <small id="marken-info"></small></span><button class="knopf-leise" id="marken-weg" hidden>Zurücksetzen</button></div>
      <input type="search" id="marken-suche" placeholder="Hersteller suchen …" aria-label="Hersteller suchen" autocomplete="off">
      <ul class="marken-liste" id="marken-liste"></ul>
      <button class="knopf-leise" id="marken-mehr" hidden></button>
    </section>
  </div>
  <div class="nav-fuss"><button id="nav-zeigen">Artikel anzeigen</button></div>
</nav>
<main>
  <nav class="pfad" id="pfad" aria-label="Pfad" hidden></nav>
  <div id="meldung"></div>
  <details class="tipps" id="tipps" hidden><summary></summary><ul></ul></details>
  <ul class="liste" id="liste"></ul>
  <button class="mehr" id="mehr" hidden>Weitere anzeigen</button>
</main>
</div>
<div class="nav-schleier" id="nav-schleier"></div>
<div id="detail">
  <div class="schleier" id="schleier"></div>
  <div class="blatt" id="blatt" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };

// ------------------------------------------------------------------ Daten laden (Skript-Dateien, funktioniert auch per file://)
var GELADEN = {}, WARTET = {};
window.PT_LADE = function (name, daten) { GELADEN[name] = daten; (WARTET[name] || []).forEach(function (f) { f(daten); }); delete WARTET[name]; };
function lade(name) {
  return new Promise(function (ok, fehler) {
    if (GELADEN[name]) return ok(GELADEN[name]);
    if (WARTET[name]) { WARTET[name].push(ok); return; }
    WARTET[name] = [ok];
    var s = document.createElement('script');
    s.src = 'daten/' + name + '.js?v=' + (name === 'index' ? Date.now() : encodeURIComponent(window.PT_VERSION || ''));
    s.onerror = function () { delete WARTET[name]; fehler(new Error(name)); };
    document.head.appendChild(s);
  });
}

// Neue Daten erkennen: index.js frisch (ohne Cache) laden und den Stand vergleichen
function pruefeStand(beiNeu) {
  var vorher = window.PT_LADE;
  window.PT_LADE = function (name, daten) {
    if (name === 'index') { window.PT_LADE = vorher; beiNeu(daten); return; }
    vorher(name, daten);
  };
  var s = document.createElement('script');
  s.src = 'daten/index.js?t=' + Date.now();
  s.onerror = function () { window.PT_LADE = vorher; s.remove(); };
  s.onload = function () { s.remove(); };
  document.head.appendChild(s);
}

lade('index').then(start, function () {
  var ohne = location.protocol === 'file:'
    ? 'Keine Daten gefunden. Bitte zuerst <code>abrufen.ps1</code> ausführen.'
    : 'Noch keine Preisdaten vorhanden – der Abruf läuft. Die Seite lädt sie automatisch, sobald sie da sind.';
  $('meldung').innerHTML = '<div class="hinweis">' + ohne + '</div>';
  // Ohne Daten: jede Minute nachsehen und dann neu laden
  if (location.protocol !== 'file:') setInterval(function () { pruefeStand(function () { location.reload(); }); }, 60000);
});

function start(D) {
window.PT_VERSION = D.stand;
var A = D.auswertung || {};
var CFG = {
  tageMedian: A.tageMedian || 90, minTage: A.minTageHistorie || 21,
  echt: A.echtesAngebotAb || 10, lock: A.lockvogelUnter || 3,
  erhTage: A.erhoehungVorAktionTage || 45, erhAb: A.erhoehungVorAktionAb || 3, dauer: A.dauerAktionAnteil || 50
};
var MARKTNAME = {}; D.maerkte.forEach(function (m) { MARKTNAME[m.id] = m.name; });
// Aktuelles Flugblatt je Markt (wogibtswas.at): Enddatum fuer Aktionen ohne eigenes Ende (Spar)
var FLUGBLATT = {}; (D.flugblaetter || []).forEach(function (f) { if (!FLUGBLATT[f.m] || f.bis > FLUGBLATT[f.m].bis) FLUGBLATT[f.m] = f; });
var KATNAME = {}, UKNAME = {}, UNTER = {}, KAT = {};
D.kategorien.forEach(function (k) { KAT[k.id] = k; KATNAME[k.id] = k.name; UNTER[k.id] = k.unter || []; (k.unter || []).forEach(function (u) { UKNAME[k.id + '/' + u.id] = u.name; }); });
function katText(a) { return UKNAME[a.k + '/' + a.uk] || KATNAME[a.k] || ''; }
// Hersteller zeigen, wenn er nicht ohnehin im Namen steht (z. B. bei Penny)
function markeHtml(a) { var s = markeSauber(a.hs); return s && s !== '-' && a.n.toLowerCase().indexOf(s.toLowerCase()) < 0 ? '<span class="hs">' + esc(s) + '</span>' : ''; }

// ------------------------------------------------------------------ Hilfen
var TAG = 86400000;
function tag(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function datum(t) { var d = new Date(t); return ('0' + d.getUTCDate()).slice(-2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.' + String(d.getUTCFullYear()).slice(2); }
var WOTAG = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
function datumKurz(t) { var d = new Date(t); return WOTAG[d.getUTCDay()] + ' ' + ('0' + d.getUTCDate()).slice(-2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.'; }
var euroF = new Intl.NumberFormat('de-AT', { style: 'currency', currency: 'EUR' });
var zahlF = new Intl.NumberFormat('de-AT');
function euro(x) { return x == null || !isFinite(x) ? '–' : euroF.format(x); }
function prozent(x) { return (x > 0 ? '+' : '') + Math.round(x) + ' %'; }
function einheit(e) { return e === 'kg' ? 'kg' : e === 'l' ? 'l' : 'Stk'; }
function packung(q, e) {
  if (e === 'kg') return q < 1 ? Math.round(q * 1000) + ' g' : String(+q.toFixed(3)).replace('.', ',') + ' kg';
  if (e === 'l') return q < 1 ? Math.round(q * 1000) + ' ml' : String(+q.toFixed(3)).replace('.', ',') + ' l';
  return Math.round(q) + ' Stk';
}
function median(werte) {
  if (!werte.length) return null;
  var s = werte.slice().sort(function (a, b) { return a - b; }), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
// Bild-URL je Groesse: 'klein' (Liste), 'mittel' (Kacheln), 'gross' (Detail)
function bildUrl(a, groesse) {
  if (!a.b) return null;
  if (a.m === 'spar') return a.b.replace(/HB_\d+px/, 'HB_500px');              // Spar liefert nur 500 px
  if (a.m === 'tchibo') return a.b.replace(/\/\d+\/image\./, '/900/image.');  // Tchibo: nur 64 und 900 px
  if (/commercetools\.com/.test(a.b)) {                                        // Billa/Penny: -small 150 px, -medium 400 px
    if (groesse === 'gross') return a.b;
    return a.b.replace(/\.(jpe?g|png|webp)$/i, (groesse === 'mittel' ? '-medium' : '-small') + '.$1');
  }
  return a.b;
}
function bildHtml(a, klasse, groesse) {
  var u = bildUrl(a, groesse);
  if (!u) return '<div class="' + klasse + ' bild-leer" aria-hidden="true">🛒</div>';
  return '<img class="' + klasse + '" src="' + esc(u) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=&quot;' + klasse + ' bild-leer&quot; aria-hidden=&quot;true&quot;>🛒</div>\'">';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

// ------------------------------------------------------------------ Auswertung je Artikel
var HEUTE = tag(D.heute);
var jetzt = new Date();
var HEUTE_LOKAL = Date.UTC(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate());
function auswerten(a) {
  var p = a.p.map(function (x) { return { t: tag(x[0]), normal: x[1], aktion: x[2], q: x[3] || a.q || 1, text: x[4] }; });
  var letzt = p[p.length - 1];
  var ende = Math.min(tag(a.z), HEUTE);
  var tage = [], j = 0;
  for (var t = p[0].t; t <= ende; t += TAG) {
    while (j + 1 < p.length && p[j + 1].t <= t) j++;
    var pt = p[j];
    tage.push({ t: t, normalE: pt.normal / pt.q, bezahltE: (pt.aktion != null ? pt.aktion : pt.normal) / pt.q, aktion: pt.aktion != null });
  }
  var r = { a: a, p: p, tage: tage, letzt: letzt, flags: [], kompakt: !!a._kompakt };
  r.tageHist = Math.round((ende - p[0].t) / TAG) + 1;
  r.normal = letzt.normal; r.aktion = letzt.aktion; r.q = letzt.q;
  r.bezahlt = letzt.aktion != null ? letzt.aktion : letzt.normal;
  r.einheitspreis = r.bezahlt / r.q;
  r.normalEinheit = letzt.normal / r.q;
  r.inAktion = letzt.aktion != null && tag(a.z) >= HEUTE - TAG;
  // Aktionszeitraum laut Markt (Lidl/Penny: von-bis, Hofer: ab) und Vorschau auf kommende Angebote
  r.av = a.av ? tag(a.av) : null; r.ab = a.ab ? tag(a.ab) : null;
  r.vorschau = a.vp != null && !r.inAktion;
  if (r.inAktion && r.ab != null && r.ab < HEUTE_LOKAL) r.abgelaufen = true;

  var ab = HEUTE - CFG.tageMedian * TAG;
  var fenster = tage.filter(function (d) { return d.t >= ab && d.t < HEUTE; });
  r.median = median(fenster.map(function (d) { return d.bezahltE; }));
  r.medianNormal = median(fenster.map(function (d) { return d.normalE; }));
  r.aktionsAnteil = fenster.length ? 100 * fenster.filter(function (d) { return d.aktion; }).length / fenster.length : 0;
  r.genugDaten = r.tageHist >= CFG.minTage && r.median != null;
  r.lautMarkt = r.inAktion ? 100 * (r.aktion / r.normal - 1) : null;

  if (r.inAktion) {
    var k = tage.length - 1;
    while (k > 0 && tage[k - 1].aktion) k--;
    r.aktionSeit = tage[k].t;
    r.seitBeginn = k === 0;   // Aktion lief schon, als die Aufzeichnung begann
    r.vsMedian = r.median ? 100 * (r.einheitspreis / r.median - 1) : null;
    if (!r.genugDaten) r.bewertung = 'neu';
    else if (-r.vsMedian >= CFG.echt) r.bewertung = 'echt';
    else if (-r.vsMedian < CFG.lock) r.bewertung = 'lockvogel';
    else r.bewertung = 'maessig';
    var vorher = tage.filter(function (d) { return d.t < r.aktionSeit && d.t >= r.aktionSeit - CFG.erhTage * TAG; });
    if (vorher.length) {
      var minVorher = Math.min.apply(null, vorher.map(function (d) { return d.normalE; }));
      var erh = 100 * (r.normalEinheit / minVorher - 1);
      if (erh >= CFG.erhAb) r.flags.push({ art: 'erhoeht', text: 'Normalpreis vor der Aktion erhöht (' + prozent(erh) + ')' });
    }
    if (r.genugDaten && r.medianNormal && 100 * (r.normalEinheit / r.medianNormal - 1) >= CFG.erhAb && !r.flags.length)
      r.flags.push({ art: 'statt', text: '„Statt“-Preis über dem üblichen Normalpreis (' + prozent(100 * (r.normalEinheit / r.medianNormal - 1)) + ')' });
  }
  if (r.genugDaten && r.aktionsAnteil >= CFG.dauer)
    r.flags.push({ art: 'dauer', text: 'Dauer-Aktion: ' + Math.round(r.aktionsAnteil) + ' % der letzten ' + CFG.tageMedian + ' Tage in Aktion' });
  for (var i = 1; i < p.length; i++) {
    if (p[i].q < p[i - 1].q - 1e-9) {
      var vorE = (p[i - 1].normal / p[i - 1].q), nachE = (p[i].normal / p[i].q);
      r.flags.push({ art: 'schrumpf', text: 'Packung kleiner geworden: ' + packung(p[i - 1].q, a.e) + ' → ' + packung(p[i].q, a.e) + ' am ' + datum(p[i].t) + ' (Grundpreis ' + prozent(100 * (nachE / vorE - 1)) + ')' });
    }
  }
  return r;
}

// Aktionszeitraum als Text: "bis Sa. 22.11. · noch 2 Tage", "seit 18.11.", Vorschau "ab Do. 26.11."
function restText(bis) {
  var n = Math.round((bis - HEUTE_LOKAL) / TAG);
  if (n < 0) return 'abgelaufen';
  if (n === 0) return 'nur noch heute';
  if (n === 1) return 'noch bis morgen';
  return 'noch ' + n + ' Tage';
}
function zeitraum(r) {
  if (r.vorschau) return { text: 'Angebot ab ' + (r.av ? datumKurz(r.av) : 'demnächst') + ' für ' + euro(r.a.vp) + (r.ab ? ' (bis ' + datumKurz(r.ab) + ')' : ''), klasse: 'z-bald' };
  if (!r.inAktion) return null;
  if (r.ab != null) return { text: (r.av ? datumKurz(r.av) + ' – ' : 'bis ') + datumKurz(r.ab) + ' · ' + restText(r.ab), klasse: (r.ab - HEUTE_LOKAL) <= TAG ? 'z-knapp' : 'z-ok' };
  var fb = FLUGBLATT[r.a.m];
  if (fb && !r.kompakt) { var fbBis = tag(fb.bis); return { text: 'laut ' + (MARKTNAME[r.a.m] || '') + '-Flugblatt bis ' + datumKurz(fbBis) + ' · ' + restText(fbBis), klasse: (fbBis - HEUTE_LOKAL) <= TAG ? 'z-knapp' : 'z-ok' }; }
  if (r.av != null && r.a.m === 'hofer') return { text: 'seit ' + datumKurz(r.av) + ' · solange der Vorrat reicht', klasse: 'z-offen' };
  if (r.aktionSeit != null) return { text: (r.seitBeginn ? 'in Aktion seit mind. ' : 'in Aktion seit ') + datumKurz(r.aktionSeit) + ' · Ende vom Markt nicht angegeben', klasse: 'z-offen' };
  return null;
}

// ------------------------------------------------------------------ Datenbestand im Browser
var POOL = {};                 // id -> ausgewerteter Artikel (voll)
var ANGEBOTE = null;           // Liste der Angebote (voll)
var KATDATEN = {};             // kat-id -> Liste (voll)
var LAEDT = {};                // kat-id -> wird gerade geladen
var SUCHE = null;              // kompakter Index aller Artikel
var SUCHE_ID = {};             // id -> Indexzeile
function merkeVoll(liste) { return liste.map(function (a) { var r = POOL[a.id]; if (!r) { r = auswerten(a); POOL[a.id] = r; } return r; }); }
function ladeKat(k) {
  if (KATDATEN[k]) return Promise.resolve(KATDATEN[k]);
  return lade('kat-' + k).then(function (l) { KATDATEN[k] = merkeVoll(l); return KATDATEN[k]; });
}
function ladeSuche() {
  if (SUCHE) return Promise.resolve(SUCHE);
  return lade('suche').then(function (l) { SUCHE = l; l.forEach(function (z) { SUCHE_ID[z[0]] = z; }); return l; });
}
var KOMP = {};                 // id -> Kurz-Artikel aus dem Suchindex (Zwischenspeicher)
// Hersteller: Schreibweisen zusammenfassen (z. B. "COCA-COLA" und "Coca-Cola")
function markeSauber(hs) { return hs ? String(hs).replace(/[*®™©]/g, '').replace(/\s+/g, ' ').trim() : ''; }
function mk(hs) { var s = markeSauber(hs).toLowerCase(); return s && s !== '-' ? s : '-'; }
var MARKE_NAME = { '-': 'ohne Angabe' };
function kompakt(z) {
  // Indexzeile [id, Name, Markt, Kat, Unterkat, Preis, Aktionspreis, Menge, Einheit] -> Kurz-Artikel
  return POOL[z[0]] || KOMP[z[0]] || (KOMP[z[0]] = auswerten({ id: z[0], n: z[1], m: z[2], k: z[3], uk: z[4], q: z[7], e: z[8], hs: z[9], a: D.heute, z: D.heute, p: [[D.heute, z[5], z[6], z[7], null]], _kompakt: true }));
}

// ------------------------------------------------------------------ Ausblenden und Favoriten (lokal im Browser)
var AUS_KEY = 'preis-tracker-ausgeblendet';
function ladeAus() { try { return JSON.parse(localStorage.getItem(AUS_KEY) || '[]'); } catch (e) { return []; } }
function speichereAus(l) { try { localStorage.setItem(AUS_KEY, JSON.stringify(l)); } catch (e) {} }
var ausgeblendet = new Set(ladeAus());
var FAV_KEY = 'preis-tracker-favoriten';
var favoriten = new Set((function () { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; } })());
function schalteFav(id) {
  if (favoriten.has(id)) favoriten.delete(id); else favoriten.add(id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favoriten))); } catch (e) {}
}
function sternHtml(id) { var an = favoriten.has(id); return '<button class="stern" data-fav="' + esc(id) + '" aria-pressed="' + an + '" aria-label="' + (an ? 'Aus Favoriten entfernen' : 'Als Favorit merken') + '" title="' + (an ? 'Aus Favoriten entfernen' : 'Als Favorit merken') + '">' + (an ? '★' : '☆') + '</button>'; }

// ------------------------------------------------------------------ Zustand / Filter
var Z = { reiter: 'angebote', maerkte: new Set(D.maerkte.map(function (m) { return m.id; })), kategorie: '', unter: '', bewertung: '', sort: '', suche: '', zeigeAus: false, nurFav: false, ansicht: 'liste', limit: 100, marken: new Set() };
try { var ans = localStorage.getItem('preis-tracker-ansicht'); if (ans === 'kacheln' || ans === 'liste') Z.ansicht = ans; } catch (e) {}
try { var gespeichert = JSON.parse(localStorage.getItem('preis-tracker-filter') || 'null'); if (gespeichert) { Z.reiter = gespeichert.reiter || Z.reiter; Z.kategorie = KAT[gespeichert.kategorie] ? gespeichert.kategorie : ''; Z.unter = gespeichert.unter || ''; Z.nurFav = !!gespeichert.nurFav; if (gespeichert.maerkteAus && gespeichert.maerkteAus.length) { gespeichert.maerkteAus.forEach(function (m) { Z.maerkte.delete(m); }); if (!Z.maerkte.size) Z.maerkte = new Set(D.maerkte.map(function (m) { return m.id; })); } } } catch (e) {}
function merke() { try { localStorage.setItem('preis-tracker-filter', JSON.stringify({ reiter: Z.reiter, kategorie: Z.kategorie, unter: Z.unter, nurFav: Z.nurFav, maerkteAus: D.maerkte.map(function (m) { return m.id; }).filter(function (m) { return !Z.maerkte.has(m); }) })); } catch (e) {} }

var SORT = {
  angebote: [['bewertung', 'Beste Angebote zuerst'], ['endet', 'Endet bald'], ['ersparnis', 'Größte Ersparnis (laut Verlauf)'], ['grundpreis', 'Günstigster Grundpreis'], ['name', 'Name']],
  alle: [['name', 'Name'], ['grundpreis', 'Günstigster Grundpreis'], ['aenderung', 'Zuletzt geändert']]
};
var RANG = { echt: 0, maessig: 1, neu: 2, lockvogel: 3 };

$('stand').textContent = 'Stand ' + new Date(D.stand).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' }) + ' · ' + zahlF.format(D.gesamt || 0) + ' Artikel' + (D.fehler && D.fehler.length ? ' · nicht geladen: ' + D.fehler.join(', ') : '');
$('maerkte').innerHTML = D.maerkte.map(function (m) { return '<button class="chip" data-m="' + m.id + '">' + esc(m.name) + '</button>'; }).join('');

function fuelleSortierung() {
  $('sortierung').innerHTML = SORT[Z.reiter].map(function (s) { return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join('');
  if (!SORT[Z.reiter].some(function (s) { return s[0] === Z.sort; })) Z.sort = SORT[Z.reiter][0][0];
  $('sortierung').value = Z.sort;
}

// Welche Artikel stehen gerade zur Auswahl? Laedt bei Bedarf nach (dann zeichne() erneut).
var ladeHinweis = '';
function bestand(reiter) {
  reiter = reiter || Z.reiter;
  if (reiter === 'angebote') {
    if (!ANGEBOTE) { ladeHinweis = 'Angebote werden geladen …'; return null; }
    return ANGEBOTE;
  }
  if (Z.kategorie) {
    if (!KATDATEN[Z.kategorie]) { ladeHinweis = KATNAME[Z.kategorie] + ' wird geladen …'; ladeKat(Z.kategorie).then(zeichne); return null; }
    return KATDATEN[Z.kategorie];
  }
  if (Z.nurFav) {
    // Favoriten ueber alle Kategorien: deren Kategorie-Dateien nachladen
    if (!SUCHE) { ladeHinweis = 'Favoriten werden geladen …'; ladeSuche().then(zeichne); return null; }
    var fehlt = {}; favoriten.forEach(function (id) { if (!POOL[id] && SUCHE_ID[id]) fehlt[SUCHE_ID[id][3]] = 1; });
    var ks = Object.keys(fehlt);
    if (ks.length) { ladeHinweis = 'Favoriten werden geladen …'; Promise.all(ks.map(ladeKat)).then(zeichne); return null; }
    var l = []; favoriten.forEach(function (id) { if (POOL[id]) l.push(POOL[id]); });
    return l;
  }
  if (Z.suche.trim().length >= 2 || Z.marken.size) {
    if (!SUCHE) { ladeHinweis = 'Suchindex wird geladen …'; ladeSuche().then(zeichne); return null; }
    return SUCHE.map(kompakt);
  }
  return 'uebersicht';
}

function gefiltert(ohneUnter, reiter, ohneMarke) {
  reiter = reiter || Z.reiter;
  var basis = bestand(reiter);
  if (!basis || basis === 'uebersicht') return basis;
  var nurAngebote = reiter === 'angebote', bald = Z.bewertung === 'demnaechst';
  var q = Z.suche.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var mf = !ohneMarke && Z.marken.size;
  return basis.filter(function (r) {
    if (!Z.maerkte.has(r.a.m)) return false;
    if (mf && !Z.marken.has(mk(r.a.hs))) return false;
    if (Z.kategorie && r.a.k !== Z.kategorie) return false;
    if (!ohneUnter && Z.kategorie && Z.unter && r.a.uk !== Z.unter) return false;
    return passtOhneKat(r, nurAngebote, bald, q);
  });
}
// alle Filter ausser Markt und Kategorie
function passtOhneKat(r, nurAngebote, bald, q) {
  if (!Z.zeigeAus && ausgeblendet.has(r.a.id)) return false;
  if (Z.nurFav && !favoriten.has(r.a.id)) return false;
  if (nurAngebote) { if (bald ? !r.vorschau : !r.inAktion) return false; }
  if (Z.bewertung === 'flag') { if (!r.flags.length) return false; }
  else if (Z.bewertung && !bald && r.bewertung !== Z.bewertung) return false;
  if (q.length) { var n = r.a.n.toLowerCase(); for (var i = 0; i < q.length; i++) if (n.indexOf(q[i]) < 0) return false; }
  return true;
}

// ------------------------------------------------------------------ Kategorie-Menue (links, am Handy ausklappbar)
var NAV_OFFEN = {};   // manuell aufgeklappte Kategorien
var PFEIL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Zaehler je Kategorie/Unterkategorie passend zu Reiter und Filtern (Markt, Favoriten, Suche, Bewertung)
function navZahlen() {
  var kz = {}, uz = {}, ges = 0, q = Z.suche.trim().toLowerCase().split(/\s+/).filter(Boolean);
  function zaehle(k, uk) { ges++; kz[k] = (kz[k] || 0) + 1; uz[k + '/' + uk] = (uz[k + '/' + uk] || 0) + 1; }
  if (Z.reiter === 'angebote') {
    if (!ANGEBOTE) return null;
    var bald = Z.bewertung === 'demnaechst';
    ANGEBOTE.forEach(function (r) { if (Z.maerkte.has(r.a.m) && (!Z.marken.size || Z.marken.has(mk(r.a.hs))) && passtOhneKat(r, true, bald, q)) zaehle(r.a.k, r.a.uk); });
  } else {

  for (var g = 0; g <= 3; g++) { var v = lo + (hi - lo) * g / 3, yy = y(v); s += '<line x1="' + L + '" x2="' + (B - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--linie)"/><text x="' + (L - 4) + '" y="' + (yy + 4) + '" text-anchor="end">' + v.toFixed(2).replace('.', ',') + '</text>'; }
  s += '<text x="' + L + '" y="' + (H - 6) + '">' + datum(t0) + '</text><text x="' + (B - R) + '" y="' + (H - 6) + '" text-anchor="end">' + datum(t1) + '</text>';
  tage.forEach(function (d) { if (d.aktion) s += '<rect x="' + x(d.t) + '" y="' + O + '" width="' + Math.max(1, (B - L - R) * TAG / (t1 - t0)) + '" height="' + (H - O - U) + '" fill="var(--gut-bg)" opacity=".7"/>'; });
  if (r.median) s += '<line x1="' + L + '" x2="' + (B - R) + '" y1="' + y(r.median) + '" y2="' + y(r.median) + '" stroke="var(--mittel)" stroke-dasharray="4 3"/>';
  s += '<path d="' + treppe(function (d) { return d.normalE; }) + '" fill="none" stroke="var(--leise)" stroke-width="2"/>';
  s += '<path d="' + treppe(function (d) { return d.bezahltE; }) + '" fill="none" stroke="var(--akzent)" stroke-width="2.5"/>';
  if (tage.length === 1) s += '<circle cx="' + x(t0) + '" cy="' + y(tage[0].bezahltE) + '" r="4" fill="var(--akzent)"/>';
  return s + '</svg>';
}

function oeffne(id) {
  var r = POOL[id];
  if (!r || r.kompakt) {
    // Voller Artikel steckt in der Kategorie-Datei: nachladen
    var z = SUCHE_ID[id]; var k = z ? z[3] : null;
    if (!k) return;
    return ladeKat(k).then(function () { if (POOL[id] && !POOL[id].kompakt) oeffne(id); });
  }
  var a = r.a, e = einheit(a.e), h = '';
  h += '<button class="zu" id="zu" aria-label="Schließen">×</button>';
  if (a.b) h += bildHtml(a, 'bild-gross', 'gross');
  h += '<h2>' + esc(a.n) + '</h2>';
  h += '<div class="meta" style="color:var(--leise);font-size:13px;display:flex;gap:8px;flex-wrap:wrap"><span class="markt m-' + a.m + '">' + esc(MARKTNAME[a.m]) + '</span>' + markeHtml(a) + '<span>' + packung(r.q, a.e) + '</span><span>' + esc(katText(a)) + '</span><span>beobachtet seit ' + datum(tag(a.a)) + '</span></div>';
  h += zeitHtml(r, 'p');
  h += '<div class="kennzahlen">';
  h += '<div class="kz"><span>' + (r.inAktion ? 'Aktionspreis' : 'Preis') + '</span><b>' + euro(r.bezahlt) + '</b><span>' + euro(r.einheitspreis) + ' / ' + e + '</span></div>';
  if (r.inAktion) h += '<div class="kz"><span>„Statt“ laut Markt</span><b>' + euro(r.normal) + '</b><span>' + prozent(r.lautMarkt) + '</span></div>';
  h += '<div class="kz"><span>Median ' + CFG.tageMedian + ' Tage</span><b>' + (r.median ? euro(r.median) + ' / ' + e : '–') + '</b><span>' + (r.genugDaten ? (r.inAktion && r.vsMedian != null ? prozent(r.vsMedian) + ' jetzt' : r.tageHist + ' Tage Verlauf') : 'erst ' + r.tageHist + ' Tag(e) Verlauf') + '</span></div>';
  h += '</div>';
  if (r.inAktion) h += '<div><span class="badge b-' + r.bewertung + '">' + BEWERTUNG_TEXT[r.bewertung] + '</span>' + (r.letzt.text ? ' <span style="color:var(--leise);font-size:13px">' + esc(r.letzt.text) + '</span>' : '') + '</div>';
  if (r.flags.length) h += '<ul class="befund">' + r.flags.map(function (f) { return '<li>' + esc(f.text) + '</li>'; }).join('') + '</ul>';
  h += '<h3 style="font-size:14px;margin:14px 0 4px">Grundpreis je ' + e + '</h3>' + diagramm(r);
  h += '<div class="legende"><span><i style="background:var(--akzent)"></i>bezahlt</span><span><i style="background:var(--leise)"></i>Normalpreis</span><span><i style="background:var(--mittel)"></i>Median</span><span><i style="background:var(--gut-bg);height:10px"></i>Aktion</span></div>';
  h += '<table class="punkte"><tr><th>ab</th><th>Normal</th><th>Aktion</th><th>Packung</th></tr>';
  r.p.slice().reverse().forEach(function (pt) { h += '<tr><td>' + datum(pt.t) + '</td><td>' + euro(pt.normal) + '</td><td>' + (pt.aktion != null ? euro(pt.aktion) + (pt.text ? ' <span style="color:var(--leise)">' + esc(pt.text) + '</span>' : '') : '–') + '</td><td>' + packung(pt.q, a.e) + '</td></tr>'; });
  h += '</table>';
  h += '<div id="kaeufe"></div>';
  var aus = ausgeblendet.has(a.id);
  h += '<div class="aktionen"><button id="fav-detail">' + (favoriten.has(a.id) ? '★ Favorit' : '☆ Als Favorit merken') + '</button><a href="' + esc(a.u) + '" target="_blank" rel="noopener">Im Shop ansehen ↗</a><button id="ausblenden">' + (aus ? 'Wieder einblenden' : 'Nicht relevant – ausblenden') + '</button></div>';
  h += '<p style="color:var(--leise);font-size:12px;margin-top:10px">Ausblenden gilt nur in diesem Browser. Dauerhaft für alle: <code>"' + esc(a.id) + '"</code> in <code>konfig.json</code> unter <code>ausgeblendet</code> eintragen.</p>';
  $('blatt').innerHTML = h;
  document.body.classList.add('offen');
  if (window.PT_KAEUFE) window.PT_KAEUFE(a.id, $('kaeufe'));
  $('zu').onclick = schliesse;
  $('fav-detail').onclick = function () { schalteFav(a.id); this.textContent = favoriten.has(a.id) ? '★ Favorit' : '☆ Als Favorit merken'; zeichne(); };
  $('ausblenden').onclick = function () {
    if (ausgeblendet.has(a.id)) ausgeblendet.delete(a.id); else ausgeblendet.add(a.id);
    speichereAus(Array.from(ausgeblendet)); schliesse(); zeichne();
  };
  $('zu').focus();
}
function schliesse() { document.body.classList.remove('offen'); }

// ------------------------------------------------------------------ Ereignisse
$('r-angebote').onclick = function () { Z.reiter = 'angebote'; Z.limit = 100; fuelleSortierung(); merke(); zeichne(); };
$('r-alle').onclick = function () { Z.reiter = 'alle'; Z.limit = 100; Z.bewertung = ''; fuelleSortierung(); merke(); zeichne(); };
$('maerkte').onclick = function (ev) {
  var b = ev.target.closest('[data-m]'); if (!b) return;
  var m = b.dataset.m;
  if (Z.maerkte.has(m) && Z.maerkte.size === 1) D.maerkte.forEach(function (x) { Z.maerkte.add(x.id); });
  else if (Z.maerkte.size === D.maerkte.length) { Z.maerkte = new Set([m]); }
  else if (Z.maerkte.has(m)) Z.maerkte.delete(m); else Z.maerkte.add(m);
  Z.limit = 100; merke(); zeichne();
};
function waehleKat(k, uk) { Z.kategorie = k; Z.unter = uk || ''; Z.limit = 100; if (k) NAV_OFFEN[k] = true; merke(); zeichne(); window.scrollTo({ top: 0 }); }
function navKlick(ev) {
  var weg = ev.target.closest('[data-mk-weg]');
  if (weg) { Z.marken.delete(weg.dataset.mkWeg); Z.limit = 100; zeichne(); return; }
  var auf = ev.target.closest('[data-auf]');
  if (auf) { var id = auf.dataset.auf, li = auf.closest('.nav-kat'), an = !li.classList.contains('offen'); NAV_OFFEN[id] = an; li.classList.toggle('offen', an); auf.setAttribute('aria-expanded', an); return; }
  var b = ev.target.closest('[data-nk]'); if (!b) return;
  var k = b.dataset.nk, uk = b.dataset.nu || '';
  // Am Handy: Kategorie mit Unterkategorien antippen -> aufklappen, Menue bleibt offen; sonst Menue schliessen
  var bleibtOffen = handy.matches && k && !uk && KAT[k] && (KAT[k].unter || []).length && ev.currentTarget === $('nav-kats') && !(Z.kategorie === k && !Z.unter);
  waehleKat(k, uk);
  if (handy.matches && !bleibtOffen) navAuf(false);
}
$('nav-kats').onclick = navKlick;
$('marken-liste').onchange = function (ev) {
  var c = ev.target.closest('[data-mk]'); if (!c) return;
  if (c.checked) Z.marken.add(c.dataset.mk); else Z.marken.delete(c.dataset.mk);
  Z.limit = 100; zeichne();
};
$('marken-suche').oninput = function () { MARKEN_Q = this.value; zeichneMarken(false); };
$('marken-mehr').onclick = function () { MARKEN_ALLE = !MARKEN_ALLE; zeichneMarken(false); };
$('marken-weg').onclick = function () { Z.marken.clear(); Z.limit = 100; zeichne(); };
$('pfad').onclick = navKlick;
$('kat-knopf').onclick = function () { navAuf(!document.body.classList.contains('nav-offen')); };
$('nav-zu').onclick = $('nav-schleier').onclick = $('nav-zeigen').onclick = function () { navAuf(false); };
if (handy.addEventListener) handy.addEventListener('change', function () { navAuf(false); });
// Hoehe des (sticky) Kopfbereichs fuer das Menue
function kopfHoehe() { var hd = document.querySelector('header'); document.documentElement.style.setProperty('--kopf-h', (getComputedStyle(hd).position === 'sticky' ? hd.offsetHeight : 0) + 'px'); }
kopfHoehe(); window.addEventListener('resize', kopfHoehe);
if (window.ResizeObserver) new ResizeObserver(kopfHoehe).observe(document.querySelector('header'));
$('unter').onclick = function (ev) {
  var b = ev.target.closest('[data-uk]'); if (!b || b.disabled) return;
  Z.unter = b.dataset.uk; Z.limit = 100; merke(); zeichne();
};
$('bewertung').onchange = function () { Z.bewertung = this.value; Z.limit = 100; if (Z.bewertung === 'demnaechst' && Z.sort === 'bewertung') { Z.sort = 'endet'; $('sortierung').value = 'endet'; } zeichne(); };
$('sortierung').onchange = function () { Z.sort = this.value; zeichne(); };
var timer; $('suche').oninput = function () { var v = this.value; clearTimeout(timer); timer = setTimeout(function () { Z.suche = v; Z.limit = 100; zeichne(); }, 250); };
Array.prototype.forEach.call(document.querySelectorAll('[data-ansicht]'), function (b) {
  b.onclick = function () { Z.ansicht = b.dataset.ansicht; try { localStorage.setItem('preis-tracker-ansicht', Z.ansicht); } catch (e) {} zeichne(); };
});
$('nur-fav').onclick = function () { Z.nurFav = !Z.nurFav; Z.limit = 100; merke(); zeichne(); };
function reset() { Z.maerkte = new Set(D.maerkte.map(function (m) { return m.id; })); Z.kategorie = ''; Z.unter = ''; Z.bewertung = ''; Z.suche = ''; Z.nurFav = false; Z.marken.clear(); MARKEN_Q = ''; $('marken-suche').value = ''; $('suche').value = ''; merke(); zeichne(); }
$('zuruecksetzen').onclick = reset;
$('meldung').onclick = function (ev) {
  if (ev.target.closest('[data-reset]')) reset();
  var w = ev.target.closest('[data-favwechsel]');
  if (w) { Z.reiter = w.dataset.favwechsel; Z.limit = 100; if (Z.reiter === 'alle') Z.bewertung = ''; fuelleSortierung(); merke(); zeichne(); }
};
$('mehr').onclick = function () { Z.limit += 200; zeichne(); };
$('liste').onclick = function (ev) {
  var s = ev.target.closest('[data-fav]');
  if (s) { ev.stopPropagation(); schalteFav(s.dataset.fav); zeichne(); return; }
  var kk = ev.target.closest('[data-kat]'); if (kk) { waehleKat(kk.dataset.kat); return; }
  var z = ev.target.closest('.zeile'); if (z && z.dataset.id) oeffne(z.dataset.id);
};
$('liste').onkeydown = function (ev) { if (ev.key === 'Enter') { var kk = ev.target.closest('[data-kat]'); if (kk) return waehleKat(kk.dataset.kat); var z = ev.target.closest('.zeile'); if (z && z.dataset.id) oeffne(z.dataset.id); } };
$('schleier').onclick = schliesse;
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { schliesse(); navAuf(false); } });

fuelleSortierung();
zeichne();
// Angebote sofort, Suchindex (fuer Favoriten-Zaehler und Suche) im Hintergrund laden
lade('angebote').then(function (l) { ANGEBOTE = merkeVoll(l); zeichne(); return ladeSuche(); }).then(function () { zeichne(); });
// Schnittstelle fuer Erweiterungen (Einkaeufe/Rechnungen)
window.PT = { D: D, POOL: POOL, ladeSuche: ladeSuche, SUCHE_ID: SUCHE_ID, oeffne: oeffne, euro: euro, datum: datum, tag: tag };

// Alle 5 Minuten (und beim Zurueckkehren in den Tab) nach neuem Datenstand sehen und dann neu laden.
// Ist gerade ein Artikel-Detail offen, erst einen Hinweis zeigen statt die Seite unter den Fingern zu wechseln.
var letztePruefung = Date.now();
function neueDatenDa(neu) {
  if (!neu || neu.stand === D.stand) return;
  if (!document.body.classList.contains('offen')) { location.reload(); return; }
  if ($('neu-hinweis')) return;
  var h = document.createElement('div');
  h.id = 'neu-hinweis'; h.className = 'hinweis';
  h.innerHTML = 'Neue Preise verfügbar (Stand ' + new Date(neu.stand).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' }) + '). <button class="knopf-leise">Jetzt laden</button>';
  h.querySelector('button').onclick = function () { location.reload(); };
  $('meldung').prepend(h);
}
if (location.protocol !== 'file:') {
  setInterval(function () { letztePruefung = Date.now(); pruefeStand(neueDatenDa); }, 5 * 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - letztePruefung > 60000) { letztePruefung = Date.now(); pruefeStand(neueDatenDa); }
  });
}
}
})();
</script>
